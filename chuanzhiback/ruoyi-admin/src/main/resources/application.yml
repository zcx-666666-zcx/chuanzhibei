# 传智杯 RuoYi 后台管理系统配置
server:
  port: 8080

spring:
  application:
    name: ruoyi-admin

  profiles:
    active: dev

  # 数据源配置（与现有 demo 共享同一数据库）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/intangible_heritage?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 20250709
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # Redis 配置（如未安装 Redis，可暂时注释掉此段）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10000s
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  # 文件上传
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.ruoyi.system.domain,com.ruoyi.heritage.domain
  global-config:
    db-config:
      id-type: auto
      table-prefix: sys_
      logic-delete-field: delFlag
      logic-delete-value: 2
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 若依自定义配置
ruoyi:
  # 文件上传路径
  profile: /tmp/ruoyi/uploadPath
  # 是否允许删除文件
  delete: true
  # Token 配置
  token:
    header: Authorization
    secret: chuanzhibei-admin-secret-key-2024
    expire-seconds: 86400

# 日志配置
logging:
  level:
    root: INFO
    com.ruoyi: DEBUG
    com.ruoyi.system.mapper: DEBUG

app:
  db:
    schema-bootstrap:
      enabled: true

# SpringDoc / Swagger
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
