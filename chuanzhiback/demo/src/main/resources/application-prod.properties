# 数据库配置 - MySQL（生产环境）
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA 配置（生产）
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis 配置（生产）
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3000ms

# 生产仅允许明确来源，禁止通配
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS}

# 生产默认关闭样例数据初始化
app.data.init-sample=${INIT_SAMPLE_DATA:false}
app.data.seed-ar-project-table=${SEED_AR_PROJECT_TABLE:false}

# 生产环境关闭 schema-bootstrap.sql（应由 DBA 手动管理表结构）
app.db.schema-bootstrap.enabled=${SCHEMA_BOOTSTRAP:false}

# 对外访问根 URL（须 https，用于拼接头像/上传资源等；与小程序合法域名一致）
app.public-base-url=${PUBLIC_BASE_URL}

# 反向代理 / 网关后的真实 scheme 与 Host（Nginx 需转发 X-Forwarded-*）
server.forward-headers-strategy=framework

# 认证配置（生产必须显式配置）
app.auth.token-secret=${TOKEN_SECRET}
app.auth.token-expire-seconds=${TOKEN_EXPIRE_SECONDS:2592000}

# Actuator（生产）
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false
