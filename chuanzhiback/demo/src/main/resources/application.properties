spring.application.name=demo

# 禁用 Docker Compose 自动生命周期
spring.docker.compose.enabled=false
spring.docker.compose.lifecycle-management=none

# 数据库配置 - MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/intangible_heritage?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:20250709}

# JPA 配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.base-dir=${UPLOAD_BASE_DIR:../uploads}

# Redis 配置
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3000ms

# 服务器配置
server.port=${SERVER_PORT:8001}

# 联调配置：允许的前端来源（逗号分隔）
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}

# 用于生成静态资源完整 URL（可选）
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:${server.port}}

# 数据初始化（生产默认关闭，避免覆盖真实库）
app.data.init-sample=${INIT_SAMPLE_DATA:true}
