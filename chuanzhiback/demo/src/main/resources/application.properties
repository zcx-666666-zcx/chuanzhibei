spring.application.name=demo
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# 禁用 Docker Compose 自动生命周期
spring.docker.compose.enabled=false
spring.docker.compose.lifecycle-management=none

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.base-dir=${UPLOAD_BASE_DIR:../uploads}

# 服务器配置
server.port=${SERVER_PORT:8001}

# 用于生成静态资源完整 URL（可选）
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:${server.port}}
