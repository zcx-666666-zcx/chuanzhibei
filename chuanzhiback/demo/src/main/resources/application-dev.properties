# 数据库配置 - MySQL（开发环境）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/intangible_heritage?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:20250709}

# JPA 配置（开发）
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis 配置（开发）
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=3000ms

# 联调配置：允许的前端来源（逗号分隔）
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}

# 数据初始化（开发默认开启）
app.data.init-sample=${INIT_SAMPLE_DATA:true}

# 认证配置（开发）
app.auth.token-secret=${TOKEN_SECRET:dev-token-secret-change-in-prod}
app.auth.token-expire-seconds=${TOKEN_EXPIRE_SECONDS:2592000}

# Actuator（开发）
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,env,threaddump,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
